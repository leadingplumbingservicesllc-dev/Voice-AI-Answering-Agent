services:
  - type: web
    name: leading-call-desk
    runtime: docker
    plan: starter
    region: ohio
    healthCheckPath: /healthz
    numInstances: 1
    disk:
      name: call-desk-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: APP_MODE
        value: live
      - key: DATABASE_PATH
        value: /var/data/call-desk.sqlite
      - key: SESSION_SECRET
        generateValue: true
      - key: PUBLIC_BASE_URL
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_NUMBER
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: FALLBACK_URL
        sync: false
